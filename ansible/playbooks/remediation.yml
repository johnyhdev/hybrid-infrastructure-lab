---

- name: Remediate workload services
  hosts: workload
  become: true

  tasks:

    - name: Ensure Nginx is running
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Ensure PostgreSQL is running
      ansible.builtin.systemd:
        name: postgresql
        enabled: true
        state: started

    - name: Ensure sample application is running
      ansible.builtin.systemd:
        name: sample-app
        enabled: true
        state: started

    - name: Ensure node exporter is running
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
