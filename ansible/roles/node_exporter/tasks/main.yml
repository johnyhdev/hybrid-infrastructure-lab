---
- name: Create node exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# Tự động chọn đúng arch (amd64 hoặc arm64) dựa theo facts của VM
- name: Download node exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    mode: "0644"

- name: Extract node exporter
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp
    remote_src: true

- name: Install node exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-1.9.1.linux-{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart node exporter

- name: Create node exporter service with optimized collectors
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      Group=node_exporter
      ExecStart=/usr/local/bin/node_exporter \
        --web.listen-address=":9100" \
        --collector.disable-defaults \
        --collector.cpu \
        --collector.meminfo \
        --collector.diskstats \
        --collector.filesystem \
        --collector.netdev \
        --collector.loadavg \
        --collector.stat \
        --collector.time \
        --collector.uname
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Restart node exporter

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable node exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
