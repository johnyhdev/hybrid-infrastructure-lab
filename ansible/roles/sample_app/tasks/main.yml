---

- name: Install Python
  ansible.builtin.apt:
    name:
      - python3
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: /opt/sample-app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create sample application
  ansible.builtin.copy:
    dest: /opt/sample-app/app.py
    owner: root
    group: root
    mode: "0755"
    content: |
      from http.server import BaseHTTPRequestHandler, HTTPServer

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              body = b"Hybrid Infrastructure Lab - Application OK\n"

              self.send_response(200)
              self.send_header("Content-Type", "text/plain")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

      server = HTTPServer(("127.0.0.1", 8080), Handler)
      server.serve_forever()

- name: Create systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/sample-app.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Hybrid Infrastructure Lab Sample App
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/python3 /opt/sample-app/app.py
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start sample application
  ansible.builtin.systemd:
    name: sample-app
    enabled: true
    state: started
