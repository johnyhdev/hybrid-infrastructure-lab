[defaults]
inventory = ./inventory/generated/azure.yml
roles_path = ./roles:../roles:/etc/ansible/roles
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
timeout = 30
private_key_file = ~/.ssh/vm-cm-workload
remote_tmp = /tmp/.ansible-${USER}/tmp
inject_facts_as_vars = false

[ssh_connection]
pipelining = True