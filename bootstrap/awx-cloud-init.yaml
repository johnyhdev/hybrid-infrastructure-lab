#cloud-config

package_update: true

packages:
  - curl
  - git
  - jq
  - tar

write_files:
  - path: /usr/local/bin/install-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -euo pipefail

      if command -v tailscale >/dev/null 2>&1; then
        exit 0
      fi

      curl -fsSL https://tailscale.com/install.sh | sh

  - path: /usr/local/bin/install-k3s.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -euo pipefail

      if systemctl is-active --quiet k3s; then
        exit 0
      fi

      curl -sfL https://get.k3s.io | sh -

runcmd:
  # Ghi log ra file để dễ dàng audit/debug qua Serial Console nếu có sự cố
  - exec > /var/log/awx-cloud-init.log 2>&1

  - /usr/local/bin/install-tailscale.sh
  - systemctl enable --now tailscaled

  # Chờ tailscaled service khởi động sẵn sàng
  - sleep 3

  # Kích hoạt WIF Authentication với Azure Managed Identity
  - |
    tailscale up \
      --client-id="${tailscale_client_id}" \
      --audience="${tailscale_audience}" \
      --advertise-tags=tag:awx \
      --hostname=vm-awx

  - /usr/local/bin/install-k3s.sh
  - systemctl enable --now k3s