#cloud-config

hostname: ${hostname}
fqdn: ${hostname}

package_update: true

packages:
  - curl
  - git
  - jq
  - tar
  - python3
  - python3-pip
  - python3-venv

write_files:
  # ==========================================================
  # 0. ENABLE SYSCTL IP FORWARDING FOR SUBNET ROUTER
  # ==========================================================
  - path: /etc/sysctl.d/99-tailscale.conf
    permissions: "0644"
    owner: root:root
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1

  # ==========================================================
  # 1. TAILSCALE INSTALL
  # ==========================================================
  - path: /usr/local/bin/install-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if command -v tailscale >/dev/null 2>&1; then
        echo "Tailscale already installed."
        exit 0
      fi

      echo "Installing Tailscale..."
      curl -fsSL https://tailscale.com/install.sh | sh
      tailscale version

  # ==========================================================
  # 2. TAILSCALE JOIN (WIF / OIDC) WITH SUBNET ROUTER & SSH ENABLED
  # ==========================================================
  - path: /usr/local/bin/join-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      TS_STATUS=$(tailscale status --json 2>/dev/null | jq -r '.BackendState // empty' || true)
      if [ "$TS_STATUS" = "Running" ]; then
        echo "Tailscale đã ở trạng thái Running, bỏ qua auto-join."
        exit 0
      fi

      echo "Waiting for Azure Managed Identity..."
      AZURE_JWT_TOKEN=""

      for i in {1..30}; do
        AZURE_JWT_TOKEN="$(
          curl -fsS \
            -H Metadata:true \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2019-08-01&resource=api://AzureADTokenExchange" \
            | jq -r '.access_token // empty'
        )" || true

        if [ -n "$${AZURE_JWT_TOKEN}" ]; then
          echo "Azure Managed Identity token acquired."
          break
        fi

        echo "Managed Identity not ready. Retry $${i}/30..."
        sleep 3
      done

      if [ -z "$${AZURE_JWT_TOKEN}" ]; then
        echo "ERROR: Failed to obtain Azure Managed Identity token."
        exit 1
      fi

      echo "Joining Tailscale, advertising Subnet Route and ENABLING TAILSCALE SSH..."
      tailscale up \
        --reset \
        --id-token="$${AZURE_JWT_TOKEN}" \
        --client-id="${tailscale_cm_client_id}" \
        --audience="${tailscale_cm_audience}" \
        --advertise-tags=tag:cm \
        --hostname="$(hostname)" \
        --advertise-routes="${workload_subnet_cidr}" \
        --accept-routes \
        --ssh

      unset AZURE_JWT_TOKEN
      echo "Tailscale join completed."
      tailscale status

  # ==========================================================
  # SYSTEMD SERVICE: AUTO RE-JOIN TAILSCALE ON BOOT
  # ==========================================================
  - path: /etc/systemd/system/tailscale-auto-join.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Tailscale Auto-Join with Azure OIDC
      After=network-online.target tailscaled.service
      Wants=network-online.target tailscaled.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/join-tailscale.sh
      RemainAfterExit=yes
      Restart=on-failure
      RestartSec=10s

      [Install]
      WantedBy=multi-user.target

runcmd:
  # 1. Khởi tạo thư mục SSH cho azureadmin an toàn
  - mkdir -p /home/azureadmin/.ssh
  - chmod 700 /home/azureadmin/.ssh
  - cat <<'EOF' > /home/azureadmin/.ssh/vm-cm-workload
    ${indent(4, internal_private_key)}
    EOF
  - cat <<'EOF' > /home/azureadmin/.ssh/vm-cm-workload.pub
    ${internal_public_key}
    EOF
  - chmod 600 /home/azureadmin/.ssh/vm-cm-workload
  - chmod 644 /home/azureadmin/.ssh/vm-cm-workload.pub
  - chown -R azureadmin:azureadmin /home/azureadmin/.ssh || true

  # 2. Apply sysctl ip_forwarding
  - sysctl -p /etc/sysctl.d/99-tailscale.conf || true

  # 3. Mở rộng dung lượng đĩa & Swap
  - lvextend -l +100%FREE /dev/mapper/ubuntu--vg-ubuntu--lv -r || true
  - dd if=/dev/zero of=/swapfile bs=1M count=2048 || true
  - chmod 600 /swapfile || true
  - mkswap /swapfile || true
  - swapon /swapfile || true
  - grep -q '/swapfile' /etc/fstab || echo '/swapfile swap swap defaults 0 0' >> /etc/fstab

  # 4. Cấu hình UFW & IP Forwarding Rule
  - ufw allow ssh
  - ufw default allow routed || true
  - ufw --force enable || true

  # 5. Cài đặt và kích hoạt Tailscale
  - /usr/local/bin/install-tailscale.sh
  - systemctl enable --now tailscaled
  - systemctl daemon-reload
  - systemctl enable --now tailscale-auto-join.service

  # 6. ZTP ENABLERS: AZURE CLI, ANSIBLE & REPO SETUP
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
  - python3 -m venv /opt/ansible-venv
  - /opt/ansible-venv/bin/pip install --upgrade pip
  - /opt/ansible-venv/bin/pip install ansible-core
  - ln -sf /opt/ansible-venv/bin/ansible /usr/local/bin/ansible
  - ln -sf /opt/ansible-venv/bin/ansible-playbook /usr/local/bin/ansible-playbook
  - ln -sf /opt/ansible-venv/bin/ansible-inventory /usr/local/bin/ansible-inventory

  # Dùng sudo -u thay cho su - để tránh trigger systemd logind PAM session fail
  - sudo -u azureadmin ansible-galaxy collection install community.general
  - |
    if [ ! -d "/home/azureadmin/hybrid-infrastructure-lab" ]; then
      sudo -u azureadmin git clone https://github.com/johnyhdev/hybrid-infrastructure-lab.git /home/azureadmin/hybrid-infrastructure-lab
    fi

  # Đảm bảo phân quyền đúng cho home folder của azureadmin
  - chown -R azureadmin:azureadmin /home/azureadmin/
  
  # Tạo file marker báo hiệu Cloud-Init đã hoàn thành 100%
  - touch /var/log/cloud-init-done.tag