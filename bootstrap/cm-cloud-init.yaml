#cloud-config

hostname: ${hostname}
fqdn: ${hostname}

package_update: true

packages:
  - curl
  - git
  - jq
  - tar

write_files:

  # ==========================================================
  # 1. TAILSCALE INSTALL
  # ==========================================================
  - path: /usr/local/bin/install-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if command -v tailscale >/dev/null 2>&1; then
        echo "Tailscale already installed."
        exit 0
      fi

      echo "Installing Tailscale..."
      curl -fsSL https://tailscale.com/install.sh | sh
      tailscale version

  # ==========================================================
  # 2. TAILSCALE JOIN (WIF / OIDC)
  # ==========================================================
  - path: /usr/local/bin/join-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      TS_STATUS=$(tailscale status --json 2>/dev/null | jq -r '.BackendState // empty' || true)
      if [ "$TS_STATUS" = "Running" ]; then
        echo "Tailscale đã ở trạng thái Running, bỏ qua auto-join."
        exit 0
      fi

      echo "Waiting for Azure Managed Identity..."
      AZURE_JWT_TOKEN=""

      # Tăng số lần retry lên 30 (90 giây) để chờ Azure MI gán xong
      for i in {1..30}; do
        AZURE_JWT_TOKEN="$(
          curl -fsS \
            -H Metadata:true \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2019-08-01&resource=api://AzureADTokenExchange" \
            | jq -r '.access_token // empty'
        )" || true

        if [ -n "$${AZURE_JWT_TOKEN}" ]; then
          echo "Azure Managed Identity token acquired."
          break
        fi

        echo "Managed Identity not ready. Retry $${i}/30..."
        sleep 3
      done

      if [ -z "$${AZURE_JWT_TOKEN}" ]; then
        echo "ERROR: Failed to obtain Azure Managed Identity token."
        exit 1
      fi

      echo "Joining Tailscale..."
      tailscale up \
        --id-token="$${AZURE_JWT_TOKEN}" \
        --client-id="${tailscale_cm_client_id}" \
        --audience="${tailscale_cm_audience}" \
        --advertise-tags=tag:cm \
        --hostname="$(hostname)" \
        --accept-routes \
        --reset

      unset AZURE_JWT_TOKEN
      echo "Tailscale join completed."
      tailscale status

  # ==========================================================
  # SYSTEMD SERVICE: AUTO RE-JOIN TAILSCALE ON BOOT
  # ==========================================================
  - path: /etc/systemd/system/tailscale-auto-join.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Tailscale Auto-Join with Azure OIDC
      After=network-online.target tailscaled.service
      Wants=network-online.target tailscaled.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/join-tailscale.sh
      RemainAfterExit=yes
      Restart=on-failure
      RestartSec=10s

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Mở rộng toàn bộ dung lượng còn trống trên đĩa vào Ubuntu root volume
  - lvextend -l +100%FREE /dev/mapper/ubuntu--vg-ubuntu--lv -r || true
  # Tự động tạo Swap file 2GB
  - dd if=/dev/zero of=/swapfile bs=1M count=2048 || true
  - chmod 600 /swapfile || true
  - mkswap /swapfile || true
  - swapon /swapfile || true
  - grep -q '/swapfile' /etc/fstab || echo '/swapfile swap swap defaults 0 0' >> /etc/fstab

  # 1. Cấu hình Firewalld mở port cho K3s & CNI Subnet
  - ufw allow ssh
  - ufw --force enable || true

  - /usr/local/bin/install-tailscale.sh
  - systemctl enable --now tailscaled

  - systemctl daemon-reload
  - systemctl enable --now tailscale-auto-join.service

  - exec > /var/log/cm-cloud-init.log 2>&1