name: Terraform Identity Plan

on:
  pull_request:
    branches:
      - main

concurrency:
  group: terraform-identity-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  check-changes:
    name: Check Path Changes
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.filter.outputs.identity }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Identity module changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            identity:
              - 'terraform/01-identity/**'
              - 'bootstrap/**'
              - '.github/workflows/terraform-identity-*.yml'
              - '.tflint.hcl'
              - '.checkov.yaml'

  plan:
    name: Terraform Identity Plan
    needs: check-changes
    if: ${{ needs.check-changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-24.04
    environment: terraform-identity-plan

    defaults:
      run:
        working-directory: terraform/01-identity

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init

      - name: TFLint Check
        run: tflint --recursive

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/01-identity
          framework: terraform
          config_file: .checkov.yaml

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      # Sử dụng tên file plan duy nhất cho module Identity để tránh đè file
      - name: Terraform Plan
        run: terraform plan -no-color -out=identity.tfplan

      - name: Show Terraform Plan
        run: terraform show -no-color identity.tfplan > identity-tfplan.txt

      - name: Publish Terraform Plan Summary
        run: |
          echo "## Terraform Identity Plan Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat identity-tfplan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create Plan Metadata
        run: |
          cat > plan-metadata.txt <<EOF
          Repository: $GITHUB_REPOSITORY
          Root Module: terraform/01-identity
          Commit SHA: ${{ github.event.pull_request.head.sha }}
          PR Number: ${{ github.event.pull_request.number }}
          PR Head SHA: ${{ github.event.pull_request.head.sha }}
          Workflow Run ID: ${{ github.run_id }}
          Plan Artifact: terraform-identity-plan-${{ github.event.pull_request.head.sha }}
          EOF

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-identity-plan-${{ github.event.pull_request.head.sha }}
          path: |
            terraform/01-identity/identity.tfplan
            terraform/01-identity/identity-tfplan.txt
            terraform/01-identity/plan-metadata.txt
          retention-days: 7