name: Tailscale Policy

on:
  pull_request:
    paths:
      - "tailscale/policy.hujson"
      - ".github/workflows/tailscale-policy.yml"

  push:
    branches:
      - main
    paths:
      - "tailscale/policy.hujson"
      - ".github/workflows/tailscale-policy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  policy:
    name: Tailscale Policy GitOps
    runs-on: ubuntu-latest
    environment: tailscale-policy

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test Policy
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ vars.TAILSCALE_POLICY_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_POLICY_AUDIENCE }}
          tailnet: ${{ vars.TAILSCALE_TAILNET }}
          policy-file: tailscale/policy.hujson
          action: test

      - name: Apply Policy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ vars.TAILSCALE_POLICY_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_POLICY_AUDIENCE }}
          tailnet: ${{ vars.TAILSCALE_TAILNET }}
          policy-file: tailscale/policy.hujson
          action: apply
