name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
      - ".tflint.hcl"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    environment: terraform-plan

    defaults:
      run:
        working-directory: terraform

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          config_file: .checkov.yaml

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # 1. TẠO FILE PLAN VÀ XUẤT OUTPUT TRỰC TIẾP
      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Render Terraform Plan Text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Publish Terraform Plan Summary
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat tfplan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Plan Metadata
          run: |
          echo "Repository: $GITHUB_REPOSITORY" > plan-metadata.txt
          echo "Commit SHA: $GITHUB_SHA" >> plan-metadata.txt
          echo "PR Number: ${{ github.event.pull_request.number }}" >> plan-metadata.txt
          echo "PR Head SHA: ${{ github.event.pull_request.head.sha }}" >> plan-metadata.txt
          echo "Workflow Run ID: ${{ github.run_id }}" >> plan-metadata.txt
          echo "Workflow Run Attempt: ${{ github.run_attempt }}" >> plan-metadata.txt
          echo "Plan Artifact: terraform-plan-${{ github.event.pull_request.head.sha }}" >> plan-metadata.txt

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.pull_request.head.sha }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
            plan-metadata.txt
          retention-days: 7