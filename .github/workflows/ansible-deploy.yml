name: Ansible CD Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-deploy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Ansible Continuous Deployment
    runs-on: ubuntu-24.04
    environment: tailscale-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Connect to Tailscale Mesh Network via OIDC
        uses: tailscale/github-action@v3
        with:
          client-id: ${{ vars.TAILSCALE_CI_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_CI_AUDIENCE }}
          tags: tag:ci

      - name: Trigger Remote Ansible Execution on CM Node via Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=no azureadmin@vm-cm-01 "cd /home/azureadmin/hybrid-infrastructure-lab && git pull origin main && cd ansible && ./run.sh"