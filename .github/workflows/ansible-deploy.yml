name: Ansible CD Deploy

on:
  workflow_run:
    workflows: ["Terraform VM Resource Apply"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Ansible Continuous Deployment
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: tailscale-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale Mesh Network via OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CI_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_CI_AUDIENCE }}
          tags: tag:ci

      # BƯỚC MỚI: Dynamically resolve CM Node IP/Hostname qua Tag:cm
      - name: Resolve CM Node Hostname
        id: resolve_node
        run: |
          echo "Resolving CM node targeted with tag:cm..."
          MAX_RETRIES=30
          RETRY_COUNT=0
          TARGET_IP=""

          until [ -n "$TARGET_IP" ]; do
            # Filter trong Tailscale mesh node nào có tag:cm và đang Online (Online = true)
            TARGET_IP=$(tailscale status --json | jq -r '.Peer[] | select(.Tags[]? == "tag:cm" and .Online == true) | .TailscaleIPs[0]' | head -n 1)

            if [ -n "$TARGET_IP" ] && [ "$TARGET_IP" != "null" ]; then
              echo "Found CM Node IP: $TARGET_IP"
              echo "cm_ip=$TARGET_IP" >> $GITHUB_OUTPUT
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "ERROR: Timed out waiting for CM Node with tag:cm to register on Tailscale."
              exit 1
            fi

            echo "CM Node with tag:cm not online yet. Retrying in 10s... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
          done

      - name: Wait for CM Node Cloud-Init Completion
        run: |
          TARGET_IP="${{ steps.resolve_node.outputs.cm_ip }}"
          echo "Waiting for SSH service and Cloud-Init bootstrapping on IP: $TARGET_IP..."
          MAX_RETRIES=30
          RETRY_COUNT=0
          
          until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 azureadmin@$TARGET_IP "test -f /var/log/cloud-init-done.tag && test -d /home/azureadmin/hybrid-infrastructure-lab" 2>/dev/null; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "ERROR: Timed out waiting for Cloud-Init setup to complete on $TARGET_IP."
              exit 1
            fi
            echo "Cloud-init or Git repo setup still in progress... Retrying in 10s ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
          done
          echo "CM Node Cloud-Init and Repository setup are 100% ready!"

      - name: Trigger Remote Ansible Execution on CM Node
        run: |
          TARGET_IP="${{ steps.resolve_node.outputs.cm_ip }}"
          ssh -o StrictHostKeyChecking=no azureadmin@$TARGET_IP "cd /home/azureadmin/hybrid-infrastructure-lab && git pull origin main && cd ansible && chmod +x run.sh && ./run.sh"