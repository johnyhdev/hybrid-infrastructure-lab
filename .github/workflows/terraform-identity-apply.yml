name: Terraform Identity Apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write

jobs:
  check-changes:
    name: Check Path Changes
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.filter.outputs.identity }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Identity module changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            identity:
              - 'terraform/01-identity/**'
              - '.github/workflows/terraform-identity-*.yml'
              - 'bootstrap/**'
              - '.tflint.hcl'
              - '.checkov.yaml'

  prepare:
    name: Find Approved Terraform Identity Plan
    needs: check-changes
    if: ${{ needs.check-changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-24.04

    outputs:
      plan_run_id: ${{ steps.find-plan.outputs.plan_run_id }}
      plan_sha: ${{ steps.find-plan.outputs.plan_sha }}
      artifact_name: ${{ steps.find-plan.outputs.artifact_name }}
      pr_number: ${{ steps.find-pr.outputs.PR_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Merged PR
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')
          PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.[0].head.sha')

          if [ -z "$PR_NUMBER" ] \vert{}\vert{} [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request found for commit ${GITHUB_SHA}"
            exit 1
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR_HEAD_SHA=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Find Successful Terraform Identity Plan
        id: find-plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ steps.find-pr.outputs.PR_HEAD_SHA }}
        run: |
          RUN_JSON=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Terraform Identity Plan" \
            --commit "$PR_HEAD_SHA" \
            --status success \
            --limit 10 \
            --json databaseId,headSha,status)

          PLAN_RUN_ID=$(echo "$RUN_JSON" | jq -r '.[0].databaseId')
          PLAN_SHA=$(echo "$RUN_JSON" | jq -r '.[0].headSha')

          if [ -z "$PLAN_RUN_ID" ] \vert{}\vert{} [ "$PLAN_RUN_ID" = "null" ]; then
            echo "No successful Terraform Identity Plan run found for SHA $PR_HEAD_SHA"
            exit 1
          fi

          ARTIFACT_NAME="terraform-identity-plan-${PR_HEAD_SHA}"

          echo "plan_run_id=$PLAN_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "plan_sha=$PLAN_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Approved Plan for Review
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find-plan.outputs.artifact_name }}
          path: approved-plan
          github-token: ${{ github.token }}
          run-id: ${{ steps.find-plan.outputs.plan_run_id }}

      - name: Publish Terraform Plan Summary
        env:
          PR_NUMBER: ${{ steps.find-pr.outputs.PR_NUMBER }}
          PR_HEAD_SHA: ${{ steps.find-pr.outputs.PR_HEAD_SHA }}
          PLAN_RUN_ID: ${{ steps.find-plan.outputs.plan_run_id }}
          ARTIFACT_NAME: ${{ steps.find-plan.outputs.artifact_name }}
        run: |
          {
            echo "## Approved Terraform Identity Plan"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| PR | #${PR_NUMBER} |"
            echo "| PR Head SHA | \`${PR_HEAD_SHA}\` |"
            echo "| Plan Run | \`${PLAN_RUN_ID}\` |"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
            echo
            echo "## Terraform Changes"
            echo
            echo '```text'
            cat approved-plan/identity-tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply Approved Terraform Identity Plan
    needs: [check-changes, prepare]
    if: ${{ needs.check-changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    environment: terraform-identity-apply

    concurrency:
      group: terraform-identity-state-lock
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform/01-identity

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Download Approved Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: terraform/01-identity
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.plan_run_id }}

      - name: Verify Terraform Plan Artifact
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.plan_sha }}
          EXPECTED_ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
        run: |
          test -f identity.tfplan
          test -f identity-tfplan.txt
          test -f plan-metadata.txt

          grep -F "Root Module: terraform/01-identity" plan-metadata.txt
          grep -F "PR Head SHA: $EXPECTED_SHA" plan-metadata.txt

          echo "Terraform Identity plan artifact verification: PASS"

      - name: Show Approved Terraform Plan
        run: terraform show -no-color identity.tfplan

      - name: Terraform Apply
        run: terraform apply -no-color identity.tfplan