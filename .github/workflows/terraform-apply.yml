name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: read

jobs:

  prepare:
    name: Find Approved Terraform Plan
    runs-on: ubuntu-latest

    outputs:
      plan_run_id: ${{ steps.find-plan.outputs.plan_run_id }}
      plan_sha: ${{ steps.find-plan.outputs.plan_sha }}
      artifact_name: ${{ steps.find-plan.outputs.artifact_name }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Merge Commit
        run: |
          echo "Main Commit SHA:"
          echo "$GITHUB_SHA"

      - name: Find Pull Request
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_HEAD_SHA=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.base.ref == "main") | .head.sha' \
            | head -n 1)

          if [ -z "$PR_HEAD_SHA" ]; then
            echo "ERROR: Could not find merged PR for commit $GITHUB_SHA"
            exit 1
          fi

          echo "PR Head SHA: $PR_HEAD_SHA"

          echo "pr_head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Find Successful Terraform Plan
        id: find-plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ steps.find-pr.outputs.pr_head_sha }}
        run: |
          echo "Searching Terraform Plan for:"
          echo "$PR_HEAD_SHA"

          RUN_ID=$(gh run list \
            --workflow terraform-plan.yml \
            --commit "$PR_HEAD_SHA" \
            --status success \
            --limit 10 \
            --json databaseId,headSha,conclusion \
            --jq '.[] | select(.headSha == "'"$PR_HEAD_SHA"'") | .databaseId' \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful Terraform Plan run found."
            exit 1
          fi

          ARTIFACT_NAME="terraform-plan-$PR_HEAD_SHA"

          echo "Plan Run ID: $RUN_ID"
          echo "Plan SHA: $PR_HEAD_SHA"
          echo "Artifact: $ARTIFACT_NAME"

          echo "plan_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "plan_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify Plan Run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ steps.find-plan.outputs.plan_run_id }}
          EXPECTED_SHA: ${{ steps.find-plan.outputs.plan_sha }}
        run: |
          ACTUAL_SHA=$(gh run view "$PLAN_RUN_ID" \
            --json headSha \
            --jq '.headSha')

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Terraform Plan SHA mismatch."
            exit 1
          fi

          echo "Terraform Plan SHA verified."


  apply:
    name: Apply Approved Terraform Plan

    needs:
      - prepare

    runs-on: ubuntu-latest

    environment:
      name: terraform-apply

    defaults:
      run:
        working-directory: terraform

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:

      - name: Checkout Main
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Download Exact Terraform Plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ needs.prepare.outputs.plan_run_id }}
          ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_name }}
        run: |
          echo "Downloading Artifact: $ARTIFACT_NAME from Run ID: $PLAN_RUN_ID"

          # Tải thẳng nội dung artifact vào thư mục làm việc hiện tại (terraform/)
          gh run download "$PLAN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir .

      - name: Verify Plan Files
        run: |
          test -f tfplan
          test -f tfplan.txt
          test -f plan-metadata.txt

          echo "Terraform plan files found."

      - name: Verify Plan Metadata
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.plan_sha }}
        run: |
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Plan metadata content:"
          cat plan-metadata.txt

          grep -q "PR Head SHA: $EXPECTED_SHA" plan-metadata.txt

          echo "Plan metadata verified."

      - name: Show Approved Terraform Plan
        run: |
          terraform show -no-color tfplan

      - name: Terraform Apply
        run: |
          terraform apply -no-color tfplan